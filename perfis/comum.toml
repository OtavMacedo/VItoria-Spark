# Ajustes de todas as placas, aplicados na inicialização antes do perfil do fabricante.
# Uma variável já definida no ambiente sempre vence. SPARK_PERFIL=0 desliga os perfis.
# Só entra aqui o que foi medido sem regressão (CONTRIBUTING.md, regra 3) e não depende do fabricante.

[ajustes]
VICTORY_ASYNC_SUBMIT = "1"
VICTORY_QUEUE2 = "1"
VICTORY_TEXTURE_NO_WAIT = "1"
VICTORY_INDIRECT_WINDOW = "1"
VICTORY_TEXTURE_BACK = "1"
VICTORY_HEAP_WORKER = "1"
VICTORY_PARALLEL_REFRESH = "1"
VICTORY_SETTLE_ROOM = "1"
VICTORY_LOOKUP_CACHE = "1"
VICTORY_NO_WATCHDOG = "1"
# Copia memória do título com uma cópia simples no processo (só pede ao kernel quando falta a página): o mesmo
# resultado byte a byte. RTX 3060 12 GB, driver 616.56, cena pesada de ~4.700 desenhos, A/B na rodada em 2 sessões:
# quadro -2,5 % (IC 95 % -3,6 a -1,4) e -3,0 % (IC -4,1 a -1,9); cópias do preparo 73 -> 58 ms; imagem igual por braço.
VICTORY_COPY_PLAIN = "1"
