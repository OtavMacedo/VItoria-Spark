name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Regras do projeto (CONTRIBUTING.md): linhas adicionadas e mensagens de cada commit do PR.
      - name: Regras do VItoria Spark
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          base="origin/${{ github.base_ref }}"
          python scripts/verificar.py --base "$base"
          for c in $(git rev-list "$base..HEAD"); do
            git log -1 --format=%B "$c" > msg.txt
            python scripts/verificar.py --mensagem msg.txt || { echo "commit $c"; exit 1; }
          done
      # Unit tests of the helper scripts (standard library only, no title files).
      - name: Script tests
        run: python -m unittest discover -s scripts -p "teste_*.py"
      # O motor de diagnóstico (scripts/motor): dados sintéticos, sem dependências.
      - name: Testes do motor
        run: python -m unittest discover -s scripts/tests
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        run: cargo test --workspace --locked --exclude victory-gpu
      # The runner has no card, so these tests make their devices on Microsoft's software
      # renderer, whose shader compiler has crashed the test program (access violation in
      # d3d10warp) when several tests used it at once. One test at a time has not shown it.
      - name: Tests, victory-gpu (one at a time)
        run: cargo test -p victory-gpu --locked -- --test-threads=1
